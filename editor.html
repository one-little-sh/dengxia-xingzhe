<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灯下行者 · 关卡编辑器</title>
  <style>
    :root {
      --bg: #0b0e14; --panel: #161c26; --ink: #e8dcc0;
      --line: #2a3444; --gold: #f0c96a; --ok: #8fc89f; --bad: #e07a6a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Microsoft YaHei", sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    /* 左栏：调色板与操作 */
    #sidebar {
      width: 230px; flex-shrink: 0; background: var(--panel);
      border-right: 1px solid var(--line); padding: 14px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
    #sidebar h1 { font-size: 15px; letter-spacing: 3px; color: var(--gold); }
    select, button {
      background: #202839; border: 1px solid #3a4356; color: var(--ink);
      font-family: inherit; font-size: 13px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer;
    }
    select { width: 100%; }
    button:hover { background: #2a3444; }
    button:disabled { opacity: .4; cursor: default; }
    .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .pal-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 2px; font-size: 11px;
    }
    .pal-btn .ch { font-size: 16px; font-weight: bold; }
    .pal-btn.active { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(240,201,106,.4); }
    .hint { font-size: 11px; color: #6b7688; line-height: 1.7; }
    .row-ops { display: flex; gap: 5px; }
    .row-ops button { flex: 1; font-size: 12px; padding: 4px; }
    /* 灯油输入行 */
    .oil-row {
      display: flex; align-items: center; gap: 8px;
      background: #202839; border: 1px solid #3a4356; border-radius: 6px;
      padding: 6px 8px; font-size: 13px;
    }
    .oil-row label { color: #9a8f76; flex: 1; }
    .oil-row input {
      width: 56px; background: #141a26; border: 1px solid #3a4356;
      color: var(--gold); font-family: inherit; font-size: 14px;
      text-align: center; border-radius: 4px; padding: 3px 4px;
    }
    .oil-row input:focus { outline: 1px solid var(--gold); }
    #lv-meta { font-size: 12px; color: #9a8f76; line-height: 1.8; border-top: 1px dashed var(--line); padding-top: 8px; }
    /* 主区 */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #toolbar {
      padding: 10px 16px; display: flex; gap: 10px; align-items: center;
      border-bottom: 1px solid var(--line); background: #0e1119;
    }
    #toolbar .status { font-size: 12px; color: #9a8f76; margin-left: auto; }
    #toolbar .status.err { color: var(--bad); }
    #canvas-wrap { flex: 1; overflow: auto; padding: 20px; }
    /* 网格 */
    #grid { display: grid; gap: 1px; width: max-content; background: var(--line); border: 1px solid var(--line); }
    .cell {
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      font-family: Consolas, monospace; font-size: 15px; font-weight: bold;
      cursor: crosshair; user-select: none; background: #141a26;
    }
    .cell:hover { outline: 1px solid var(--gold); }
    /* 校验结果 */
    #check-result {
      max-height: 180px; overflow-y: auto; padding: 10px 16px;
      border-top: 1px solid var(--line); background: #0e1119;
      font-size: 12px; line-height: 1.8; white-space: pre-line;
    }
    #check-result .ok { color: var(--ok); }
    #check-result .bad { color: var(--bad); }
    #check-result .warn { color: #d8b060; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>关卡编辑器</h1>
    <select id="level-select"></select>
    <div id="lv-meta">选择关卡…</div>
    <div class="oil-row">
      <label for="oil-input">初始灯油</label>
      <input type="number" id="oil-input" min="1" max="99" value="10" />
    </div>
    <div class="palette" id="palette"></div>
    <div class="hint">左键：放置选中字符<br>右键：擦除（改回地板）<br>拖动可连续绘制</div>
    <div class="row-ops">
      <button id="add-row">+ 行</button><button id="del-row">- 行</button>
      <button id="add-col">+ 列</button><button id="del-col">- 列</button>
    </div>
    <button id="btn-check">校验本关</button>
    <button id="btn-save" style="border-color:#6a5a30;color:#f0d890;">保存到 levels/ 文件夹</button>
    <button id="btn-copy">复制网格文本</button>
    <button id="btn-newfile">迁移本关为 txt（生成文本）</button>
    <div class="hint">保存需 Chrome/Edge 并授权 levels 文件夹；记事本改 txt 同样生效。</div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span style="font-size:13px;color:#9a8f76;">当前编辑：</span>
      <span id="cur-level" style="font-size:13px;color:var(--gold);">—</span>
      <span class="status" id="dirty-status"></span>
    </div>
    <div id="canvas-wrap"><div id="grid"></div></div>
    <div id="check-result">校验结果将显示在这里。</div>
  </div>
  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
